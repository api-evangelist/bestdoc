aid: bestdoc
name: BestDoc
description: 'BestDoc is a healthcare patient-relationship-management (PRM) company
  that helps hospitals improve the patient experience across inpatient and outpatient
  care. Its platform includes BestDoc Concierge for inpatient experience management
  (non-clinical requests, room food ordering, discharge management), BestDoc Practice
  for outpatient patient-request management, BestDoc Survey for omni-channel patient
  feedback, an AI Reply Assistant for automated review responses, and continued-care
  engagement tools. BestDoc integrates with hospital information systems (HIS), EMRs,
  and payment gateways. BestDoc Technology Pvt. Ltd. is an ISO 27001:2013 certified
  company operating from Kochi, Bangalore, and Dubai. Surfaced as a portfolio company
  of Accel and added to the API Evangelist network. No public developer API is
  currently published.'
